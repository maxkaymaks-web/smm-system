<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>LAKMODA — визитка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2f4150;
    --ink-soft: #6c7d8c;
    --pill: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }

  body {
    position: relative;
    font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      linear-gradient(180deg,
        #fdf6f2 0%,
        #fde6dc 18%,
        #fbd2c2 42%,
        #f5b7a3 70%,
        #efa28d 92%,
        #ec9b85 100%);
  }

  /* dotted texture overlay */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(100, 60, 50, 0.08) 1px, transparent 1.3px);
    background-size: 14px 14px;
    mix-blend-mode: multiply;
    opacity: 0.55;
    pointer-events: none;
  }

  /* light highlight from top */
  body::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 30%);
    pointer-events: none;
  }

  /* top thin line with dot ends */
  .top-line, .bottom-line {
    position: absolute;
    left: 90px;
    right: 90px;
    height: 1px;
    background: rgba(47, 65, 80, 0.30);
  }
  .top-line    { top: 145px; }
  .bottom-line { bottom: 110px; }

  .top-line::before, .top-line::after,
  .bottom-line::before, .bottom-line::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(47, 65, 80, 0.45);
    transform: translateY(-50%);
  }
  .top-line::before, .bottom-line::before { left: -3px; }
  .top-line::after,  .bottom-line::after  { right: -3px; }

  /* small ornament dash–circle–dash */
  .ornament {
    position: absolute;
    top: 230px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .ornament .seg {
    width: 110px;
    height: 1px;
    background: rgba(47, 65, 80, 0.35);
  }
  .ornament .circle {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(47, 65, 80, 0.50);
    background: transparent;
  }

  /* central block */
  .stack {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    padding: 0 80px;
  }

  .logo {
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 96px;
    letter-spacing: 18px;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 26px;
    padding-left: 18px; /* compensate letter-spacing */
  }

  .sub {
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 30px;
    letter-spacing: 11px;
    color: var(--ink);
    margin-bottom: 44px;
    padding-left: 11px;
  }

  .divider {
    width: 50px;
    height: 1px;
    background: rgba(47, 65, 80, 0.45);
    margin: 0 auto 36px;
  }

  /* slogan — single line, slightly larger & darker than original */
  .slogan {
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 34px;
    letter-spacing: 0.5px;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 38px;
    white-space: nowrap;
  }

  .pill {
    display: inline-block;
    background: var(--pill);
    color: var(--ink);
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 32px;
    letter-spacing: 1.2px;
    padding: 18px 54px 20px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(150, 80, 60, 0.10);
  }
</style>
</head>
<body>
  <div class="top-line"></div>

  <div class="ornament">
    <div class="seg"></div>
    <div class="circle"></div>
    <div class="seg"></div>
  </div>

  <div class="stack">
    <div class="logo">LAKMODA</div>
    <div class="sub">МАНИКЮР &amp; ПЕДИКЮР</div>
    <div class="divider"></div>
    <div class="slogan">Ваш идеальный образ рядом с домом</div>
    <div class="pill">lakmoda.ru</div>
  </div>

  <div class="bottom-line"></div>
</body>
</html>
