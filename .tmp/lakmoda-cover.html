<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>LAKMODA — обложка Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2f4150;
    --pill: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }

  body {
    position: relative;
    font-family: 'Montserrat', system-ui, sans-serif;
    color: var(--ink);
    background: url("lakmoda-cover-bg.png") center center / cover no-repeat;
  }

  /* bottom pink mask — fully opaque over original text band */
  .mask {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 820px;
    background:
      linear-gradient(180deg,
        rgba(253, 235, 226, 0.00) 0%,
        rgba(252, 220, 208, 0.55) 14%,
        rgba(250, 200, 184, 0.92) 28%,
        rgba(247, 188, 168, 1.00) 38%,
        rgba(245, 183, 163, 1.00) 60%,
        #f3b29e 100%);
  }

  /* dotted texture inside the mask, like on фото.png */
  .mask::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(100, 60, 50, 0.08) 1px, transparent 1.3px);
    background-size: 14px 14px;
    mix-blend-mode: multiply;
    opacity: 0.45;
    pointer-events: none;
  }

  /* text stack — pinned to lower part */
  .stack {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 130px;
    text-align: center;
    padding: 0 80px;
  }

  .super {
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 8px;
    color: var(--ink);
    margin-bottom: 22px;
    text-transform: uppercase;
  }

  .logo {
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 96px;
    letter-spacing: 18px;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 26px;
    padding-left: 18px; /* visual centering with letter-spacing */
  }

  .sub {
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 30px;
    letter-spacing: 11px;
    color: var(--ink);
    margin-bottom: 44px;
    padding-left: 11px;
  }

  .pill {
    display: inline-block;
    background: var(--pill);
    color: var(--ink);
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 32px;
    letter-spacing: 1.2px;
    padding: 18px 54px 20px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(150, 80, 60, 0.10);
  }
</style>
</head>
<body>
  <div class="mask"></div>

  <div class="stack">
    <div class="super">Салон красоты</div>
    <div class="logo">LAKMODA</div>
    <div class="sub">МАНИКЮР &amp; ПЕДИКЮР</div>
    <div class="pill">lakmoda.ru</div>
  </div>
</body>
</html>
