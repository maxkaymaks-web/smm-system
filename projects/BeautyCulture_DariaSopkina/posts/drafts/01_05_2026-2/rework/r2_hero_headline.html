<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Raleway:wght@300;400;500;600&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#EBD9C5}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 50%,#F5E6D2 0%,#EBD9C5 55%,#DAC4AC 100%)}

.tag-tl{position:absolute;top:46px;left:54px;font-family:'Raleway',sans-serif;font-size:15px;font-weight:500;letter-spacing:0.4em;text-transform:uppercase;color:#3a2e22}
.tag-tr{position:absolute;top:46px;right:54px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#3a2e22;letter-spacing:0.06em}

.headline{position:absolute;top:96px;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:170px;line-height:0.92;color:#2a221c;text-transform:uppercase;letter-spacing:0.02em}
.sub{position:absolute;top:300px;left:0;right:0;text-align:center;font-family:'Raleway',sans-serif;font-size:15px;font-weight:500;letter-spacing:0.6em;text-transform:uppercase;color:#6b5340}

.pill-l{position:absolute;top:362px;left:108px;background:#2a221c;color:#F5E6D2;font-family:'Raleway',sans-serif;font-size:15px;font-weight:500;letter-spacing:0.42em;text-transform:uppercase;padding:14px 36px;border-radius:99px;z-index:5}
.pill-r{position:absolute;top:362px;right:108px;background:#2a221c;color:#F5E6D2;font-family:'Raleway',sans-serif;font-size:15px;font-weight:500;letter-spacing:0.42em;text-transform:uppercase;padding:14px 36px;border-radius:99px;z-index:5}

.photos{position:absolute;top:438px;left:54px;right:54px;display:flex;gap:28px;z-index:4}
.photo{flex:1;height:740px;border-radius:14px;overflow:hidden;box-shadow:0 28px 60px rgba(60,40,20,0.22)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}

.foot{position:absolute;left:0;right:0;bottom:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 60px;z-index:6}
.foot .left{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:32px;color:#2a221c;line-height:1}
.foot .left .num{font-weight:700;font-size:88px;letter-spacing:-0.03em;display:inline-block;vertical-align:-12px;margin-right:10px}
.foot .left .label{font-family:'Raleway',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.5em;text-transform:uppercase;color:#6b5340;display:block;margin-top:6px}
.foot .right{text-align:right;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;color:#2a221c;text-transform:uppercase;letter-spacing:0.32em}
.foot .right .stamp{font-family:'Raleway',sans-serif;font-size:10px;font-weight:400;letter-spacing:0.5em;color:#6b5340;display:block;margin-top:6px}
</style></head>
<body><div class="slide">
  <div class="tag-tl">До · После</div>
  <div class="tag-tr">Культура</div>
  <div class="headline">Подмышки</div>
  <div class="sub">— Лазерная эпиляция —</div>
  <div class="pill-l">До</div>
  <div class="pill-r">После</div>
  <div class="photos">
    <div class="photo"><img src="../../../../assets/images/before-after/armpit_1_before_up.jpg"></div>
    <div class="photo"><img src="../../../../assets/images/before-after/armpit_1_after_up.jpg"></div>
  </div>
  <div class="foot">
    <div class="left"><span class="num">4</span>процедуры<span class="label">заметный результат</span></div>
    <div class="right">Культура<span class="stamp">студия красоты</span></div>
  </div>
</div></body></html>
