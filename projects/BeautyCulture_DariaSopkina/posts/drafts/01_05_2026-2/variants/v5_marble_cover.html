<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Raleway:wght@300;400;500;600&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0908}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden}
.bg{position:absolute;inset:0;background:url('../../../../assets/images/post03-slide-01.jpg') center/cover;filter:brightness(0.85) contrast(1.05)}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,9,8,0.18) 0%,rgba(10,9,8,0.32) 50%,rgba(10,9,8,0.05) 100%);z-index:1}
.zone-tag{position:absolute;top:52px;left:60px;font-family:'Raleway',sans-serif;font-size:12px;font-weight:500;letter-spacing:0.42em;text-transform:uppercase;color:rgba(245,240,234,0.55);z-index:10}
.brand{position:absolute;top:52px;right:60px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:rgba(245,240,234,0.65);letter-spacing:0.08em;z-index:10}
.headline{position:absolute;top:130px;left:60px;right:60px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:156px;line-height:0.92;color:#F5F0EA;text-transform:uppercase;letter-spacing:-0.005em;z-index:10}
.sub{position:absolute;top:308px;left:60px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:rgba(245,240,234,0.78);letter-spacing:0.04em;z-index:10}
.cards{position:absolute;left:60px;right:60px;bottom:160px;display:flex;gap:22px;z-index:10}
.card{flex:1;height:580px;border-radius:6px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(0,0,0,0.6)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.label{position:absolute;top:16px;left:16px;background:rgba(10,9,8,0.78);color:#F5F0EA;font-family:'Raleway',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.4em;text-transform:uppercase;padding:9px 18px;border-radius:99px;backdrop-filter:blur(8px)}
.foot{position:absolute;left:0;right:0;bottom:54px;text-align:center;z-index:10}
.foot .meta{font-family:'Raleway',sans-serif;font-size:12px;font-weight:400;letter-spacing:0.42em;text-transform:uppercase;color:rgba(245,240,234,0.55)}
</style></head>
<body><div class="slide">
<div class="bg"></div><div class="veil"></div>
<div class="zone-tag">Зона · 02</div>
<div class="brand">Культура</div>
<div class="headline">Подмышки</div>
<div class="sub">после 4 процедур</div>
<div class="cards">
  <div class="card"><img src="../../../../assets/images/before-after/armpit_1_before_up.jpg"><div class="label">До</div></div>
  <div class="card"><img src="../../../../assets/images/before-after/armpit_1_after_up.jpg"><div class="label">После</div></div>
</div>
<div class="foot"><div class="meta">лазерная эпиляция · до и после</div></div>
</div></body></html>
