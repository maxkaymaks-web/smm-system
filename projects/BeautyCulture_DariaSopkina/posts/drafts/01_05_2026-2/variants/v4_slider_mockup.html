<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Raleway:wght@300;400;500;600&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#1a1714}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden}
.dip{position:absolute;inset:0;display:flex}
.dip>div{flex:1;height:100%;position:relative;overflow:hidden}
.dip img{width:100%;height:100%;object-fit:cover;display:block}
.slider-line{position:absolute;top:0;left:540px;width:2px;height:100%;background:rgba(245,240,234,0.95);z-index:5}
.slider-handle{position:absolute;top:50%;left:540px;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;background:rgba(245,240,234,0.96);display:flex;align-items:center;justify-content:center;font-family:'Raleway',sans-serif;font-size:32px;font-weight:300;color:#1a1714;letter-spacing:-0.04em;box-shadow:0 12px 32px rgba(0,0,0,0.4);z-index:6}
.tag{position:absolute;top:42px;font-family:'Raleway',sans-serif;font-size:12px;font-weight:500;letter-spacing:0.4em;text-transform:uppercase;color:#1a1714;background:rgba(245,240,234,0.94);padding:11px 22px;border-radius:99px;z-index:7}
.tag.left{left:42px}
.tag.right{right:42px}
.brand{position:absolute;top:48px;left:50%;transform:translateX(-50%);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:rgba(245,240,234,0.85);letter-spacing:0.1em;z-index:7;text-shadow:0 2px 8px rgba(0,0,0,0.5)}
.foot{position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(180deg,transparent 0%,rgba(26,23,20,0.78) 60%,rgba(26,23,20,0.92) 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:42px;z-index:7}
.foot h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:42px;color:#F5F0EA;text-transform:uppercase;letter-spacing:0.42em}
.foot .meta{margin-top:10px;font-family:'Raleway',sans-serif;font-size:11px;font-weight:400;letter-spacing:0.36em;text-transform:uppercase;color:rgba(245,240,234,0.7)}
</style></head>
<body><div class="slide">
<div class="dip">
  <div><img src="../../../../assets/images/before-after/armpit_1_before_up.jpg"></div>
  <div><img src="../../../../assets/images/before-after/armpit_1_after_up.jpg"></div>
</div>
<div class="slider-line"></div>
<div class="slider-handle">↔</div>
<div class="brand">Культура</div>
<div class="tag left">До</div>
<div class="tag right">После</div>
<div class="foot"><h1>Подмышки</h1><div class="meta">4 процедуры · лазерная эпиляция</div></div>
</div></body></html>
