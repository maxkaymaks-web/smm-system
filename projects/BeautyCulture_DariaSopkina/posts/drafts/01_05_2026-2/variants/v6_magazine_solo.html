<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Raleway:wght@300;400;500;600&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#1a1714}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden}
.bg{position:absolute;inset:0;background:url('../../../../assets/images/before-after/armpit_1_after_up.jpg') center/cover;filter:brightness(0.92) contrast(1.04) saturate(0.88)}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(245,240,234,0.18) 0%,rgba(245,240,234,0.05) 30%,rgba(26,23,20,0.32) 80%,rgba(26,23,20,0.55) 100%);z-index:1}
.zone-tag{position:absolute;top:52px;left:60px;font-family:'Raleway',sans-serif;font-size:12px;font-weight:500;letter-spacing:0.42em;text-transform:uppercase;color:rgba(26,23,20,0.7);z-index:10}
.brand{position:absolute;top:52px;right:60px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:rgba(26,23,20,0.7);letter-spacing:0.08em;z-index:10}
.giant-num{position:absolute;left:30px;top:130px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:920px;line-height:0.85;color:#1a1714;letter-spacing:-0.07em;z-index:5;text-shadow:0 8px 32px rgba(255,250,245,0.22)}
.giant-num-stroke{display:none}
.medallion{position:absolute;right:60px;top:200px;width:380px;height:480px;border-radius:8px;overflow:hidden;box-shadow:0 24px 60px rgba(26,23,20,0.55);border:4px solid #FAF8F5;z-index:7}
.medallion img{width:100%;height:100%;object-fit:cover;display:block}
.medallion-tag{position:absolute;top:14px;left:14px;background:rgba(26,23,20,0.78);color:#F5F0EA;font-family:'Raleway',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.4em;text-transform:uppercase;padding:7px 16px;border-radius:99px;z-index:8}
.foot{position:absolute;left:60px;right:60px;bottom:60px;display:flex;justify-content:space-between;align-items:flex-end;z-index:10}
.foot h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:88px;line-height:0.92;color:#F5F0EA;text-transform:uppercase;letter-spacing:-0.005em}
.foot .meta{font-family:'Raleway',sans-serif;font-size:12px;font-weight:400;letter-spacing:0.36em;text-transform:uppercase;color:rgba(245,240,234,0.7);margin-top:10px}
.foot .right-meta{font-family:'Raleway',sans-serif;font-size:11px;font-weight:400;letter-spacing:0.32em;text-transform:uppercase;color:rgba(245,240,234,0.55);text-align:right}
</style></head>
<body><div class="slide">
<div class="bg"></div><div class="veil"></div>
<div class="zone-tag">Заметный результат</div>
<div class="brand">Культура</div>
<div class="giant-num">4</div>
<div class="giant-num-stroke">4</div>
<div class="medallion"><img src="../../../../assets/images/before-after/armpit_1_before_up.jpg"><div class="medallion-tag">До</div></div>
<div class="foot">
  <div><h1>Подмышки</h1><div class="meta">после 4 процедур</div></div>
  <div class="right-meta">лазерная<br>эпиляция</div>
</div>
</div></body></html>
