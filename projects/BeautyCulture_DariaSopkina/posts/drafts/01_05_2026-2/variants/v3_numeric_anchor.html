<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Raleway:wght@300;400;500;600&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#FAF8F5}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden}
.tag-top{position:absolute;top:52px;left:60px;font-family:'Raleway',sans-serif;font-size:12px;font-weight:500;letter-spacing:0.36em;text-transform:uppercase;color:#8a6e52;z-index:10}
.brand{position:absolute;top:52px;right:60px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:rgba(26,23,20,0.55);letter-spacing:0.08em;z-index:10}
.giant-num{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1180px;line-height:0.78;color:#E2D2BC;letter-spacing:-0.07em;z-index:1;user-select:none;opacity:0.9}
.cards{position:absolute;top:280px;left:60px;right:60px;height:880px;display:flex;gap:48px;align-items:center;justify-content:center;z-index:5}
.card{width:368px;height:820px;border-radius:6px;overflow:hidden;box-shadow:0 30px 60px rgba(26,23,20,0.22);position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card-tag{position:absolute;top:16px;left:16px;background:rgba(250,248,245,0.94);color:#1a1714;font-family:'Raleway',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.34em;text-transform:uppercase;padding:8px 16px;border-radius:99px}
.head{position:absolute;left:0;right:0;top:108px;text-align:center;z-index:10}
.head h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:78px;color:#1a1714;text-transform:uppercase;letter-spacing:0.06em}
.head .sub{margin-top:8px;font-family:'Raleway',sans-serif;font-size:12px;font-weight:500;letter-spacing:0.4em;text-transform:uppercase;color:#8a6e52}
.foot{position:absolute;left:0;right:0;bottom:60px;text-align:center;z-index:10}
.foot .label{font-family:'Raleway',sans-serif;font-size:12px;font-weight:500;letter-spacing:0.4em;text-transform:uppercase;color:#1a1714;display:block}
.foot .stamp{margin-top:8px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:rgba(26,23,20,0.6);letter-spacing:0.1em}
</style></head>
<body><div class="slide">
<div class="tag-top">До · После</div>
<div class="brand">Лазерная эпиляция</div>
<div class="giant-num">4</div>
<div class="head"><h1>Подмышки</h1><div class="sub">после 4 процедур</div></div>
<div class="cards">
  <div class="card"><img src="../../../../assets/images/before-after/armpit_1_before_up.jpg"><div class="card-tag">До</div></div>
  <div class="card"><img src="../../../../assets/images/before-after/armpit_1_after_up.jpg"><div class="card-tag">После</div></div>
</div>
<div class="foot"><span class="label">процедуры</span><span class="stamp">Культура</span></div>
</div></body></html>
