<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Raleway:wght@300;400;500;600&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#FAF8F5}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden}
.dip{position:absolute;top:0;left:0;width:1080px;height:1190px;display:flex}
.dip>div{flex:1;height:100%;position:relative;overflow:hidden}
.dip img{width:100%;height:100%;object-fit:cover;display:block}
.divider{position:absolute;top:0;left:540px;width:1px;height:1190px;background:#FAF8F5;z-index:5}
.tag{position:absolute;top:36px;font-family:'Raleway',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.36em;text-transform:uppercase;color:#FAF8F5;background:rgba(26,23,20,0.62);padding:10px 22px;border-radius:99px;backdrop-filter:blur(6px);z-index:6}
.tag.left{left:36px}
.tag.right{right:36px}
.foot{position:absolute;left:0;right:0;bottom:0;height:160px;background:#FAF8F5;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.foot h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:78px;line-height:1;color:#1a1714;text-transform:uppercase;letter-spacing:0.04em}
.foot .meta{margin-top:14px;font-family:'Raleway',sans-serif;font-size:13px;font-weight:400;letter-spacing:0.32em;text-transform:uppercase;color:#8a6e52}
.brand-stamp{position:absolute;top:32px;left:50%;transform:translateX(-50%);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:rgba(245,240,234,0.85);letter-spacing:0.1em;z-index:7}
</style></head>
<body><div class="slide">
<div class="dip">
  <div><img src="../../../../assets/images/before-after/armpit_1_before_up.jpg"><div class="tag left">До</div></div>
  <div><img src="../../../../assets/images/before-after/armpit_1_after_up.jpg"><div class="tag right">После</div></div>
</div>
<div class="divider"></div>
<div class="brand-stamp">Культура</div>
<div class="foot">
  <h1>Подмышки</h1>
  <div class="meta">после 4 процедур · лазерная эпиляция</div>
</div>
</div></body></html>
