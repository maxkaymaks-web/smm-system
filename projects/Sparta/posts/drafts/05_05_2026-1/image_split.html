<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @font-face { font-family: 'Manrope'; font-weight: 400; src: url('file:///C:/Users/Пользователь/клод/global/brand/fonts/Manrope-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Manrope'; font-weight: 700; src: url('file:///C:/Users/Пользователь/клод/global/brand/fonts/Manrope-Bold.woff2') format('woff2'); }
  @font-face { font-family: 'Manrope'; font-weight: 800; src: url('file:///C:/Users/Пользователь/клод/global/brand/fonts/Manrope-ExtraBold.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Manrope', 'Arial', sans-serif; }
  .slide { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #111111; }

  /* ── Фоновое фото (только левая часть) ── */
  .bg {
    position: absolute; top: 0; left: 0; width: 324px; height: 1920px;
    background: url('file:///C:/Users/Пользователь/клод/projects/Sparta/posts/drafts/05_05_2026-1/bg_split.jpg') left center / cover no-repeat;
  }

  /* Плавное затухание фото вправо */
  .bg-fade {
    position: absolute; top: 0; left: 200px; width: 180px; height: 1920px;
    background: linear-gradient(to right, transparent 0%, #111111 100%);
  }

  /* Вертикальная оранжевая линия-разделитель */
  .divider {
    position: absolute; top: 0; left: 324px; width: 2px; height: 1920px;
    background: #D9540D;
  }

  /* Надпись на линии */
  .divider-label {
    position: absolute; top: 50%; left: 304px;
    transform: translateY(-50%) rotate(-90deg);
    font-size: 22px; font-weight: 800; letter-spacing: 0.28em;
    text-transform: uppercase; color: #D9540D;
    white-space: nowrap;
  }

  /* Оранжевые полосы */
  .bar-top    { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: #E85404; z-index: 10; }
  .bar-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: #E85404; z-index: 10; }

  /* ── Шапка ── */
  .brand {
    position: absolute; top: 54px; left: 72px;
    font-size: 36px; font-weight: 800; letter-spacing: 0.28em;
    text-transform: uppercase; color: #FFFFFF; z-index: 5;
  }
  .brand em { color: #E85404; font-style: normal; }

  /* ── Правая панель: основной контент ── */
  .right-panel {
    position: absolute; top: 0; left: 370px; right: 0; height: 1920px;
  }

  /* Линия под шапкой */
  .header-line {
    position: absolute; top: 124px; left: -20px; right: 72px;
    height: 1px; background: rgba(232,84,4,0.22);
  }

  /* Eyebrow */
  .eyebrow {
    position: absolute; top: 156px; left: 0; right: 72px;
    font-size: 20px; font-weight: 700; letter-spacing: 0.30em;
    text-transform: uppercase; color: rgba(232,84,4,0.60);
  }

  /* Главный заголовок */
  .main-title {
    position: absolute; top: 210px; left: 0; right: 60px;
    font-size: 72px; font-weight: 800; color: #FFFFFF;
    line-height: 1.0; letter-spacing: -0.02em;
  }
  .main-title .accent { color: #E85404; }

  /* Подзаголовок */
  .main-sub {
    position: absolute; top: 490px; left: 0; right: 60px;
    font-size: 28px; font-weight: 400; color: rgba(255,255,255,0.40);
    line-height: 1.50;
  }

  /* Разделитель */
  .section-line {
    position: absolute; top: 610px; left: 0; right: 60px;
    height: 1px; background: rgba(232,84,4,0.20);
  }

  /* Чекбоксы */
  .checklist {
    position: absolute; top: 660px; left: 0; right: 60px;
  }
  .check-item {
    display: flex; align-items: flex-start; gap: 20px;
    margin-bottom: 32px;
  }
  .check-box {
    width: 36px; height: 36px; flex-shrink: 0;
    border: 2px solid rgba(217,84,13,0.55);
    margin-top: 4px;
  }
  .check-text {
    font-size: 28px; font-weight: 400; color: rgba(255,255,255,0.45);
    line-height: 1.40;
  }

  /* Нижний блок */
  .bottom-block {
    position: absolute; bottom: 100px; left: 0; right: 72px;
  }
  .bottom-quote {
    font-size: 22px; font-weight: 700; letter-spacing: 0.08em;
    color: rgba(217,84,13,0.70); text-transform: uppercase;
    margin-bottom: 40px; line-height: 1.40;
    border-left: 3px solid #D9540D;
    padding-left: 20px;
  }

  /* Футер */
  .footer {
    position: absolute; bottom: 44px; left: 0; right: 72px;
    display: flex; align-items: center; justify-content: flex-end;
  }
  .footer-site {
    font-size: 22px; font-weight: 800; letter-spacing: 0.10em;
    color: #0D0D0D; background: #E85404; padding: 12px 28px;
  }
</style>
</head>
<body>
<div class="slide">

  <div class="bg"></div>
  <div class="bg-fade"></div>
  <div class="divider"></div>
  <div class="divider-label">разрыв</div>
  <div class="bar-top"></div>
  <div class="bar-bottom"></div>

  <!-- Шапка поверх всего -->
  <div class="brand" style="z-index:10;">SPARTA<em>.</em></div>

  <!-- Мелкий текст на левой панели -->
  <div style="position:absolute; top:160px; left:22px; z-index:8;">
    <div style="font-size:19px; font-weight:800; letter-spacing:0.18em; text-transform:uppercase; color:#E85404; background:rgba(0,0,0,0.72); padding:8px 14px; display:inline-block; margin-bottom:8px;">2 дня</div><br>
    <div style="font-size:19px; font-weight:800; letter-spacing:0.18em; text-transform:uppercase; color:#FFFFFF; background:rgba(0,0,0,0.72); padding:8px 14px; display:inline-block;">Прорыв</div>
  </div>

  <!-- Правая панель -->
  <div class="right-panel">
    <div class="header-line"></div>

    <div class="eyebrow">Стратегическая сессия</div>

    <div class="main-title">
      Через месяц:<br>
      <span class="accent">ничего не<br>изменилось</span>
    </div>

    <div class="main-sub">
      сессия прошла —<br>решения приняты,<br>ответственных нет
    </div>

    <div class="section-line"></div>

    <div class="checklist">
      <div class="check-item">
        <div class="check-box"></div>
        <div class="check-text">Задача поставлена</div>
      </div>
      <div class="check-item">
        <div class="check-box"></div>
        <div class="check-text">Все согласились</div>
      </div>
      <div class="check-item">
        <div class="check-box"></div>
        <div class="check-text">Сроки определены</div>
      </div>
      <div class="check-item">
        <div class="check-box"></div>
        <div class="check-text">Никто не отвечает</div>
      </div>
    </div>

    <div class="bottom-block">
      <div class="bottom-quote">
        все согласились —<br>никто не отвечает
      </div>
    </div>

    <div class="footer">
      <div class="footer-site">sparta-tech.ru</div>
    </div>
  </div>

</div>
</body>
</html>
