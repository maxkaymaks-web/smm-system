<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Raleway:wght@300;400;500;600&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#1a1714}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden}
.bg{position:absolute;inset:0;background:url('../../../../assets/images/before-after/armpit_1_before_up.jpg') center/cover;filter:brightness(0.32) saturate(0.6)}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,23,20,0.55) 0%,rgba(26,23,20,0.85) 55%,rgba(26,23,20,0.95) 100%)}
.zone-tag{position:absolute;top:52px;left:60px;font-family:'Raleway',sans-serif;font-size:13px;font-weight:500;letter-spacing:0.32em;text-transform:uppercase;color:rgba(245,240,234,0.5);z-index:10}
.brand{position:absolute;top:52px;right:60px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:rgba(245,240,234,0.55);letter-spacing:0.08em;z-index:10}
.headline{position:absolute;top:118px;left:60px;right:60px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:128px;line-height:0.92;color:#F5F0EA;text-transform:uppercase;letter-spacing:-0.01em;z-index:10}
.sessions{position:absolute;top:298px;left:60px;z-index:10}
.sessions-num{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:230px;line-height:0.85;color:#F5F0EA;letter-spacing:-0.04em;display:block}
.sessions-label{font-family:'Raleway',sans-serif;font-size:15px;font-weight:400;letter-spacing:0.32em;text-transform:uppercase;color:#8a6e52;margin-top:14px;display:block}
.cards{position:absolute;left:60px;right:60px;bottom:130px;display:flex;gap:24px;z-index:10}
.card{flex:1;height:430px;border-radius:8px;overflow:hidden;position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.label{position:absolute;top:16px;left:16px;background:rgba(26,23,20,0.78);color:#F5F0EA;font-family:'Raleway',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.32em;text-transform:uppercase;padding:8px 16px;border-radius:99px}
.foot-cap{position:absolute;left:60px;bottom:60px;font-family:'Raleway',sans-serif;font-size:13px;font-weight:400;letter-spacing:0.28em;text-transform:uppercase;color:rgba(245,240,234,0.45);z-index:10}
.slide-num{position:absolute;right:60px;bottom:60px;font-family:'Raleway',sans-serif;font-size:13px;font-weight:400;letter-spacing:0.18em;color:rgba(245,240,234,0.4);z-index:10}
</style></head>
<body><div class="slide">
<div class="bg"></div><div class="overlay"></div>
<div class="zone-tag">До · После</div>
<div class="brand">Культура</div>
<div class="headline">Подмышки</div>
<div class="sessions">
  <span class="sessions-num">4</span>
  <span class="sessions-label">Процедуры</span>
</div>
<div class="cards">
  <div class="card"><img src="../../../../assets/images/before-after/armpit_1_before_up.jpg"><div class="label">До</div></div>
  <div class="card"><img src="../../../../assets/images/before-after/armpit_1_after_up.jpg"><div class="label">После</div></div>
</div>
<div class="foot-cap">Лазерная эпиляция</div>
<div class="slide-num">01 / 03</div>
</div></body></html>
