<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Raleway:wght@300;400;500;600&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#EBD9C5}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 50%,#F5E6D2 0%,#EBD9C5 58%,#DAC4AC 100%)}

.tag-tl{position:absolute;top:48px;left:54px;font-family:'Raleway',sans-serif;font-size:15px;font-weight:500;letter-spacing:0.4em;text-transform:uppercase;color:#3a2e22}
.tag-tr{position:absolute;top:48px;right:54px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#3a2e22;letter-spacing:0.06em}

.headline{position:absolute;top:108px;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:130px;line-height:0.92;color:#2a221c;text-transform:uppercase;letter-spacing:0.04em}
.sub{position:absolute;top:262px;left:0;right:0;text-align:center;font-family:'Raleway',sans-serif;font-size:14px;font-weight:500;letter-spacing:0.6em;text-transform:uppercase;color:#6b5340}

.left-side{position:absolute;top:380px;left:36px;width:170px;text-align:center;z-index:5}
.left-side .num{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:240px;line-height:0.85;color:#2a221c;letter-spacing:-0.04em;display:block}
.left-side .label{font-family:'Raleway',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.5em;text-transform:uppercase;color:#6b5340;display:block;margin-top:8px}
.left-side .label2{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#3a2e22;display:block;margin-top:4px;letter-spacing:0.04em}

.right-side{position:absolute;top:430px;right:36px;width:170px;text-align:center;z-index:5}
.right-side .word{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:54px;line-height:1;color:#2a221c;text-transform:uppercase;letter-spacing:0.06em;display:block}
.right-side .word + .word{margin-top:6px}
.right-side .small{font-family:'Raleway',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.5em;text-transform:uppercase;color:#6b5340;display:block;margin-top:14px}
.right-side .line{width:60px;height:1px;background:#6b5340;margin:18px auto}

.photos{position:absolute;top:362px;left:236px;right:236px;display:flex;gap:18px;z-index:4}
.photo{flex:1;height:780px;border-radius:14px;overflow:hidden;box-shadow:0 28px 60px rgba(60,40,20,0.22);position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.pill{position:absolute;top:18px;left:18px;background:#2a221c;color:#F5E6D2;font-family:'Raleway',sans-serif;font-size:12px;font-weight:500;letter-spacing:0.42em;text-transform:uppercase;padding:10px 22px;border-radius:99px}

.brand-bottom{position:absolute;left:0;right:0;bottom:60px;text-align:center;z-index:3}
.brand-bottom .name{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:36px;color:#2a221c;text-transform:uppercase;letter-spacing:0.4em;display:block}
.brand-bottom .name::before{content:"——";display:block;font-size:14px;color:#6b5340;letter-spacing:0;margin-bottom:8px}
.brand-bottom .tag{font-family:'Raleway',sans-serif;font-size:11px;font-weight:400;letter-spacing:0.5em;text-transform:uppercase;color:#6b5340;margin-top:6px;display:block}
</style></head>
<body><div class="slide">
  <div class="tag-tl">До · После</div>
  <div class="tag-tr">Культура</div>
  <div class="headline">Подмышки</div>
  <div class="sub">— Лазерная эпиляция —</div>
  <div class="left-side"><span class="num">4</span><span class="label">процедуры</span><span class="label2">после</span></div>
  <div class="right-side"><span class="word">Заметный</span><span class="word">результат</span><div class="line"></div><span class="small">До · После</span></div>
  <div class="photos">
    <div class="photo"><img src="../../../../assets/images/before-after/armpit_1_before_up.jpg"><div class="pill">До</div></div>
    <div class="photo"><img src="../../../../assets/images/before-after/armpit_1_after_up.jpg"><div class="pill">После</div></div>
  </div>
  <div class="brand-bottom"><span class="name">Культура</span><span class="tag">студия красоты</span></div>
</div></body></html>
