services:
  base: &base
    image: chatwoot/chatwoot:latest
    env_file: .env
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "chat.bitandpix.ru:5.42.112.17"   # обход stale DNS-кеша (wildcard), вебхук на свой домен
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "chat.bitandpix.ru:5.42.112.17"   # вебхуки на свой домен в обход stale DNS
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data

  gateway:
    image: python:3.12-slim
    restart: always
    working_dir: /app
    depends_on:
      - rails
    env_file: gateway.env
    ports:
      - "127.0.0.1:8090:8080"   # для nginx-проксирования вебхука с публичного домена
    volumes:
      - ./gateway:/app:ro
      - gateway_data:/data
    command: ["sh", "-c", "pip install --no-cache-dir --root-user-action=ignore fastapi 'uvicorn[standard]' httpx && python /app/gateway.py"]

volumes:
  storage_data:
  postgres_data:
  redis_data:
  gateway_data:
