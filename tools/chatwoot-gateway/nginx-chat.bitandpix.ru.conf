# nginx vhost для Chatwoot (chat.bitandpix.ru -> 127.0.0.1:3000).
# Реальная копия с сервера (SSL-строки добавлены certbot'ом).
# Класть в /etc/nginx/sites-available/, симлинк в sites-enabled/.
#
# ВАЖНО: блок `map $http_upgrade $connection_upgrade` должен быть определён
# РОВНО ОДИН РАЗ в http-контексте на весь nginx. На нашем сервере он уже задан
# в vhost'е Postiz (tech.bitandpix.ru). Если этого vhost'а нет (чистый сервер) —
# раскомментируй map ниже. Если есть — НЕ дублируй (nginx упадёт на "duplicate map").
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    server_name chat.bitandpix.ru;
    client_max_body_size 50m;            # вложения Chatwoot (лимит по умолчанию 40 МБ)

    # Приём исходящих вебхуков Chatwoot -> шлюз. Публичный путь нужен, т.к.
    # Chatwoot блокирует вебхуки на внутренние хосты (анти-SSRF). Путь секретный
    # (__WEBHOOK_TOKEN__ = openssl rand -hex 8). Шлюз опубликован на 127.0.0.1:8090.
    location /cw-__WEBHOOK_TOKEN__/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # websockets (realtime UI Chatwoot)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chat.bitandpix.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chat.bitandpix.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = chat.bitandpix.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name chat.bitandpix.ru;
    return 404; # managed by Certbot
}
