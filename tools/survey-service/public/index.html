<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Бриф — bit&amp;pix</title>
  <link href="vendor/survey-core.min.css" rel="stylesheet" />
  <style>
    body { margin: 0; background: #f4f4f6; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
    .topbar { padding: 18px 20px; font-weight: 700; font-size: 18px; color: #1a1a1a; }
    .topbar span { color: #6c5ce7; }
    #surveyElement { max-width: 820px; margin: 0 auto; padding: 0 12px 60px; }
    /* honeypot — скрыт от людей, ловит ботов */
    .hp-field { position: absolute; left: -9999px; top: -9999px; height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div class="topbar">bit<span>&amp;</span>pix — бриф</div>
  <!-- honeypot: настоящие люди это поле не видят и не заполняют -->
  <input class="hp-field" type="text" id="hp" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true" />
  <div id="surveyElement"></div>

  <script src="vendor/survey.core.min.js"></script>
  <script src="vendor/survey-js-ui.min.js"></script>
  <script src="vendor/survey.i18n.min.js"></script>
  <script>
    (async function () {
      let json;
      try {
        json = await (await fetch('survey.json', { cache: 'no-store' })).json();
      } catch (e) {
        document.getElementById('surveyElement').innerHTML =
          '<p style="text-align:center;padding:40px">Не удалось загрузить анкету. Обновите страницу.</p>';
        return;
      }

      const survey = new Survey.Model(json);
      survey.locale = 'ru';

      survey.onComplete.add(async (sender, options) => {
        options.showSaveInProgress('Отправляем…');
        const payload = {
          answers: sender.data,
          _hp: document.getElementById('hp').value || '',
        };
        try {
          const res = await fetch('submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (!res.ok) throw new Error('status ' + res.status);
          options.showSaveSuccess('Готово! Анкета отправлена.');
        } catch (e) {
          options.showSaveError('Не удалось отправить. Попробуйте ещё раз или напишите оператору.');
        }
      });

      survey.render('surveyElement');
    })();
  </script>
</body>
</html>
